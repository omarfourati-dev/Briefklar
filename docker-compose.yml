# Local development and CI. EXPLAINER defaults to "fake": no API key, no costs.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: briefklar
      POSTGRES_USER: briefklar
      POSTGRES_PASSWORD: briefklar
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefklar"]
      interval: 3s
      retries: 20

  app:
    profiles: [app]
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    environment:
      DATABASE_URL: postgres://briefklar:briefklar@postgres:5432/briefklar?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@briefklar.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password-123}
      DEMO_ENABLED: "true"
      EXPLAINER: ${EXPLAINER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}

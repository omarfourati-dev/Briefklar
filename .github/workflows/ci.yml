name: CI

# GitHub-hosted runners only; pull requests (also from forks) never reach the self-hosted runner.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go – vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache: true }
      - name: OCR tools for the extract tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu poppler-utils
      - run: go vet ./...
      - run: go test -race ./...   # testcontainers-go starts Postgres via the runner's Docker

  web:
    name: Angular – test and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway credentials for the CI stack
        run: |
          jwt=$(openssl rand -hex 32); pw=$(openssl rand -hex 16)
          echo "::add-mask::$jwt"; echo "::add-mask::$pw"
          { echo "JWT_SECRET=$jwt"; echo "ADMIN_PASSWORD=$pw"; } >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Start stack (fake explainer, no API key)
        run: |
          docker compose --profile app up -d --build
          for i in $(seq 1 60); do curl -fs http://localhost:8080/healthz && exit 0; sleep 3; done
          docker compose --profile app logs app | tail -80; exit 1
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Run Playwright
        working-directory: web
        env: { CI: "true", E2E_BASE_URL: "http://localhost:8080", E2E_ADMIN_EMAIL: "admin@briefklar.test" }
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report, retention-days: 7 }
